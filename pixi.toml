[environments]
floors = { features = ["floors"], no-default-feature = true }
scvi = { features = ["stack", "scvi"], solve-group = "torch", no-default-feature = true }
cellcharter = { features = ["stack", "scvi", "cellcharter"], solve-group = "torch", no-default-feature = true }
novae = { features = ["stack", "scvi", "novae"], solve-group = "torch", no-default-feature = true }
nicheformer = { features = ["nicheformer"], no-default-feature = true }
cellina = { features = ["cellina"], no-default-feature = true }
cpa = { features = ["cpa"], no-default-feature = true }
